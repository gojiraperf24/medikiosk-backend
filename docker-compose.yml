version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: medikiosk-db
    environment:
      POSTGRES_USER: medikiosk_user
      POSTGRES_PASSWORD: medikiosk_password
      POSTGRES_DB: medikiosk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medikiosk-network

  # Redis Cache (optional, for session management)
  redis:
    image: redis:7-alpine
    container_name: medikiosk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medikiosk-network

  # FastAPI Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medikiosk-app
    environment:
      DATABASE_URL: postgresql://medikiosk_user:medikiosk_password@db:5432/medikiosk_db
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      # Add other environment variables as needed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    networks:
      - medikiosk-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  medikiosk-network:
    driver: bridge
